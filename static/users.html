<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AIwebmaster — Users</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body class="bg-gradient-to-b from-brand-navy to-brand-navy2 text-brand-ink font-sans antialiased relative">
<div class="pointer-events-none fixed inset-0 z-0 bg-[radial-gradient(circle_at_15%_0%,rgba(63,163,154,.08),transparent_40%),radial-gradient(circle_at_85%_100%,rgba(245,185,63,.06),transparent_40%)]"></div>
<div id="app-root" class="relative z-10"></div>

<div id="page-content" class="relative z-10 flex-1 flex flex-col min-w-0 overflow-hidden h-screen">
  <header class="px-6 py-4 border-b border-brand-border bg-brand-navy/60 backdrop-blur animate-fade-in">
    <h1 class="text-sm font-semibold">Users</h1>
    <p class="text-xs text-brand-muted mt-0.5">Accounts with access to AIwebmaster and what each role can do.</p>
  </header>
  <div id="content" class="flex-1 overflow-y-auto p-6"></div>
</div>

<script src="/assets/sidebar.js"></script>
<script>
const ROLE_COLORS = { docker_ops: '#3fa39a', ui_editor: '#f5b93f', infra_admin: '#c9835a', super_admin: '#ef4444' };
const ROLE_DESC = {
  docker_ops: 'docker, git',
  ui_editor: 'content, nav_link',
  infra_admin: 'docker, git, sql, code_edit',
  super_admin: 'everything',
};

function skeleton() {
  return `<div class="space-y-2">${Array(4).fill(0).map(() => '<div class="h-12 rounded-lg bg-brand-panel border border-brand-border animate-pulse"></div>').join('')}</div>`;
}

async function load() {
  const me = await mountShell('/users');
  if (!me) return;

  const content = document.getElementById('content');
  content.innerHTML = skeleton();

  const res = await fetch('/api/users');
  if (res.status === 403) {
    content.innerHTML = `<div class="max-w-md mx-auto mt-16 text-center animate-fade-in-up">
      <div class="w-12 h-12 rounded-full bg-brand-terracotta/15 text-brand-terracotta flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 3.75h.008M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </div>
      <div class="text-sm text-brand-muted">Your role (<span class="text-brand-ink font-medium">${me.role}</span>) can't manage users — only <span class="text-brand-ink font-medium">super_admin</span> can.</div>
    </div>`;
    return;
  }
  const data = await res.json();

  const roleCounts = {};
  data.users.forEach(u => { roleCounts[u.role] = (roleCounts[u.role] || 0) + 1; });
  const activeCount = data.users.filter(u => u.active).length;
  const inactiveCount = data.users.length - activeCount;
  const neverLoggedIn = data.users.filter(u => !u.last_login_at).length;

  const STATUS_COLORS = { active: '#3fa39a', inactive: '#8ba3b6' };

  const rows = data.users.map((u, i) => `
    <tr class="border-b border-brand-border/60 hover:bg-brand-panel/60 transition-colors animate-fade-in" style="animation-delay:${i*30}ms">
      <td class="py-3 px-4">
        <div class="flex items-center gap-2.5">
          <div class="w-7 h-7 rounded-full bg-brand-panel2 border border-brand-border flex items-center justify-center text-[10px] font-bold" style="color:${ROLE_COLORS[u.role]}">${u.email[0].toUpperCase()}</div>
          <span class="text-sm">${u.email}</span>
        </div>
      </td>
      <td class="py-3 px-4"><span class="inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full" style="background:${ROLE_COLORS[u.role]}22;color:${ROLE_COLORS[u.role]}">
        <span class="w-1.5 h-1.5 rounded-full" style="background:${ROLE_COLORS[u.role]}"></span>${u.role}
      </span></td>
      <td class="py-3 px-4"><span class="inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full" style="background:${STATUS_COLORS[u.active ? 'active' : 'inactive']}22;color:${STATUS_COLORS[u.active ? 'active' : 'inactive']}">
        <span class="w-1.5 h-1.5 rounded-full" style="background:${STATUS_COLORS[u.active ? 'active' : 'inactive']}"></span>${u.active ? 'Active' : 'Inactive'}
      </span></td>
      <td class="py-3 px-4 text-xs text-brand-muted">${u.last_login_at ? u.last_login_at.slice(0,10) : 'Never'}</td>
      <td class="py-3 px-4 text-xs text-brand-muted">${u.created_at.slice(0,10)}</td>
    </tr>`).join('');

  const options = data.roles.map(r => `<option value="${r}">${r}</option>`).join('');

  content.innerHTML = `
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
      <div class="bg-brand-panel border border-brand-border rounded-xl p-5 shadow-panel animate-fade-in-up">
        <h2 class="text-sm font-semibold mb-1">Account status</h2>
        <p class="text-[11px] text-brand-muted mb-3">Logged in within the last 30 days counts as active.</p>
        <div class="flex items-center gap-4">
          <canvas id="status-chart" height="140" class="max-w-[140px]"></canvas>
          <div class="space-y-2 text-xs">
            <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full" style="background:${STATUS_COLORS.active}"></span><span class="font-medium">${activeCount}</span> active</div>
            <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full" style="background:${STATUS_COLORS.inactive}"></span><span class="font-medium">${inactiveCount}</span> inactive</div>
            <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-brand-muted"></span><span class="font-medium">${neverLoggedIn}</span> never logged in</div>
            <div class="flex items-center gap-2 pt-1 border-t border-brand-border/60 mt-1"><span class="font-medium">${data.users.length}</span> total accounts</div>
          </div>
        </div>
      </div>
      <div class="bg-brand-panel border border-brand-border rounded-xl p-5 shadow-panel animate-fade-in-up" style="animation-delay:40ms">
        <h2 class="text-sm font-semibold mb-3">Role distribution</h2>
        <canvas id="role-chart" height="140"></canvas>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-4">
        <div class="bg-brand-panel border border-brand-border rounded-xl overflow-hidden shadow-panel animate-fade-in-up">
          <table class="w-full text-left">
            <thead><tr class="border-b border-brand-border text-[11px] uppercase tracking-wider text-brand-muted">
              <th class="py-3 px-4 font-semibold">Email</th><th class="py-3 px-4 font-semibold">Role</th><th class="py-3 px-4 font-semibold">Status</th><th class="py-3 px-4 font-semibold">Last login</th><th class="py-3 px-4 font-semibold">Created</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>

        <div class="bg-brand-panel border border-brand-border rounded-xl p-5 shadow-panel animate-fade-in-up" style="animation-delay:80ms">
          <h2 class="text-sm font-semibold mb-4">Add / update user</h2>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <input id="f-email" type="email" placeholder="Email" class="px-3 py-2 rounded-lg bg-brand-navy2 border border-brand-border text-sm outline-none focus:border-brand-gold transition-all" />
            <select id="f-role" class="px-3 py-2 rounded-lg bg-brand-navy2 border border-brand-border text-sm outline-none focus:border-brand-gold transition-all">${options}</select>
            <div class="flex gap-1.5">
              <input id="f-password" type="text" placeholder="Password (create or reset)" class="min-w-0 flex-1 px-3 py-2 rounded-lg bg-brand-navy2 border border-brand-border text-sm outline-none focus:border-brand-gold transition-all font-mono" />
              <button id="f-generate" type="button" title="Generate a random password" class="shrink-0 px-3 py-2 rounded-lg bg-brand-panel2 border border-brand-border text-xs font-medium transition-all hover:border-brand-gold">Generate</button>
            </div>
          </div>
          <button id="f-submit" class="mt-3 px-4 py-2 rounded-lg bg-brand-gold text-brand-navy text-sm font-semibold transition-all hover:brightness-105 active:scale-[.98]">Save user</button>
          <div id="result" class="text-xs text-brand-muted mt-2"></div>
          <div id="gen-hint" class="text-[11px] text-brand-muted mt-1"></div>
        </div>
      </div>

      <div class="space-y-4">
        <div class="bg-brand-panel border border-brand-border rounded-xl p-5 shadow-panel animate-fade-in-up" style="animation-delay:120ms">
          <h2 class="text-sm font-semibold mb-3">What each role can do</h2>
          <div class="space-y-2.5">
            ${data.roles.map(r => `<div class="flex items-start gap-2 text-xs">
              <span class="w-2 h-2 rounded-full mt-1 shrink-0" style="background:${ROLE_COLORS[r]}"></span>
              <div><span class="font-medium">${r}</span><span class="text-brand-muted"> — ${ROLE_DESC[r]}</span></div>
            </div>`).join('')}
          </div>
        </div>
      </div>
    </div>`;

  new Chart(document.getElementById('status-chart'), {
    type: 'doughnut',
    data: {
      labels: ['Active', 'Inactive'],
      datasets: [{
        data: [activeCount, inactiveCount],
        backgroundColor: [STATUS_COLORS.active, STATUS_COLORS.inactive],
        borderColor: '#122f4a',
        borderWidth: 3,
      }],
    },
    options: {
      plugins: { legend: { display: false } },
      cutout: '65%',
    },
  });

  new Chart(document.getElementById('role-chart'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(roleCounts),
      datasets: [{
        data: Object.values(roleCounts),
        backgroundColor: Object.keys(roleCounts).map(r => ROLE_COLORS[r]),
        borderColor: '#122f4a',
        borderWidth: 3,
      }],
    },
    options: {
      plugins: { legend: { position: 'bottom', labels: { color: '#8ba3b6', font: { size: 11 }, boxWidth: 8, padding: 12 } } },
      cutout: '65%',
    },
  });

  function genPassword(length = 14) {
    // Alnum only, no ambiguous chars (0/O, 1/l/I) — easy to read back over a call/chat.
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
    const bytes = new Uint32Array(length);
    crypto.getRandomValues(bytes);
    return Array.from(bytes, b => chars[b % chars.length]).join('');
  }

  document.getElementById('f-generate').onclick = () => {
    const field = document.getElementById('f-password');
    field.value = genPassword();
    document.getElementById('gen-hint').textContent = 'Generated — copy it now, it won\'t be shown again after you save.';
  };

  document.getElementById('f-submit').onclick = async () => {
    const email = document.getElementById('f-email').value;
    const role = document.getElementById('f-role').value;
    const password = document.getElementById('f-password').value;
    const result = document.getElementById('result');
    if (!email || !password) { result.textContent = 'Email and password are required.'; return; }
    result.textContent = 'Saving…';
    try {
      const runRes = await fetch('/api/actions/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: 'user-mgmt-' + Date.now(), type: 'user_management', payload: { email, role, password } }),
      });
      const runData = await runRes.json();
      result.textContent = runRes.ok ? `Saved ${email} as ${role}.` : JSON.stringify(runData);
      if (runRes.ok) load();
    } catch (e) {
      result.textContent = String(e);
    }
  };
}
load();
</script>
</body>
</html>
