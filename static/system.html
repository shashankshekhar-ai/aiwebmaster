<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AIwebmaster — System</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body class="bg-gradient-to-b from-brand-navy to-brand-navy2 text-brand-ink font-sans antialiased relative">
<div class="pointer-events-none fixed inset-0 z-0 bg-[radial-gradient(circle_at_15%_0%,rgba(63,163,154,.08),transparent_40%),radial-gradient(circle_at_85%_100%,rgba(245,185,63,.06),transparent_40%)]"></div>
<div id="app-root" class="relative z-10"></div>

<div id="page-content" class="relative z-10 flex-1 flex flex-col min-w-0 overflow-hidden h-screen">
  <header class="px-6 py-4 border-b border-brand-border bg-brand-navy/60 backdrop-blur flex items-center justify-between animate-fade-in">
    <div>
      <h1 class="text-sm font-semibold">System</h1>
      <p class="text-xs text-brand-muted mt-0.5">Live docker &amp; host status.</p>
    </div>
    <div class="flex items-center gap-4">
      <div id="diff-badge"></div>
      <div id="refresh-note" class="text-[11px] text-brand-muted flex items-center gap-1.5"></div>
    </div>
  </header>
  <div id="content" class="flex-1 overflow-y-auto p-6"></div>
</div>
<div id="restore-modal-root" class="relative z-10"></div>

<script src="/assets/sidebar.js"></script>
<script>
let me = null;
let cpuChart = null, diskChart = null;

function parsePercent(s) { return parseFloat((s || '0').replace('%', '')) || 0; }
function parseMemMB(s) {
  // "123.4MiB / 2GiB" -> 123.4
  const used = (s || '').split('/')[0].trim();
  const m = used.match(/([\d.]+)\s*(GiB|MiB|KiB|GB|MB|KB)/i);
  if (!m) return 0;
  const val = parseFloat(m[1]); const unit = m[2].toLowerCase();
  if (unit.startsWith('g')) return val * 1024;
  if (unit.startsWith('k')) return val / 1024;
  return val;
}

function skeleton() {
  return `<div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    ${Array(3).fill(0).map(() => '<div class="h-24 rounded-xl bg-brand-panel border border-brand-border animate-pulse"></div>').join('')}
  </div><div class="h-64 rounded-xl bg-brand-panel border border-brand-border animate-pulse mt-6"></div>`;
}

// fmtBytes, ageHours, timeAgoShort, freshnessDot, statusDot are shared —
// see static/assets/sidebar.js.

async function loadDiffBadge() {
  const el = document.getElementById('diff-badge');
  if (!el) return;
  try {
    const r = await fetch('/api/deploy/diff');
    if (!r.ok) { el.innerHTML = ''; return; }
    const d = await r.json();
    el.innerHTML = d.content_changed
      ? `<span class="inline-flex items-center gap-1.5 text-[11px] text-brand-gold"><span class="w-1.5 h-1.5 rounded-full bg-brand-gold"></span>Dev and staging content differ</span>`
      : `<span class="inline-flex items-center gap-1.5 text-[11px] text-brand-muted"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>Dev and staging content in sync</span>`;
  } catch (e) { el.innerHTML = ''; }
}

async function loadDoctor() {
  const el = document.getElementById('doctor-body');
  if (!el) return;
  el.innerHTML = `<div class="text-xs text-brand-muted">Checking…</div>`;
  try {
    const r = await fetch('/api/doctor/check');
    if (r.status === 403) { el.innerHTML = `<div class="text-xs text-brand-muted">Needs docker access to view.</div>`; return; }
    const d = await r.json();
    el.innerHTML = d.checks.map(c => `<div class="flex items-start gap-2 text-xs py-1">
      ${statusDot(c.ok)}
      <span class="font-medium shrink-0">${c.name}:</span>
      <span class="text-brand-muted truncate">${(c.detail || '').replace(/</g, '&lt;')}</span>
    </div>`).join('');
  } catch (e) {
    el.innerHTML = `<div class="text-xs text-brand-muted">Could not run checks: ${String(e)}</div>`;
  }
}

const TIER_BADGE = {
  dev: 'bg-brand-teal/15 text-brand-teal',
  staging: 'bg-brand-gold/15 text-brand-gold',
  infra: 'bg-blue-400/15 text-blue-300',
  sandbox: 'bg-purple-400/15 text-purple-300',
  other: 'bg-brand-panel2 text-brand-muted',
};
const TIER_LABEL = { dev: 'Development', staging: 'Staging', infra: 'Infrastructure', sandbox: 'Sandbox', other: 'Other' };

function backupRow(b) {
  return `<div class="grid grid-cols-[1fr_auto] gap-3 items-center py-2 border-b border-brand-border/40 last:border-0">
    <div class="min-w-0">
      <div class="text-sm font-medium text-brand-ink">${b.label}</div>
      <div class="text-[11px] text-brand-muted truncate" title="${(b.description || '').replace(/"/g, '&quot;')}">${b.description || ''}</div>
    </div>
    <div class="flex flex-col items-end gap-1 shrink-0">
      <div class="flex items-center gap-1.5 text-[11px]">
        ${freshnessDot(b.modified_at)}
        <span class="text-brand-muted">local: ${b.modified_at ? timeAgoShort(b.modified_at) + ' · ' + fmtBytes(b.size_bytes) : 'none'}</span>
      </div>
      <div class="flex items-center gap-1.5 text-[11px]">
        ${freshnessDot(b.offhost_synced_at)}
        <span class="text-brand-muted">off-host: ${timeAgoShort(b.offhost_synced_at)}</span>
      </div>
      ${me && me.role === 'super_admin' && b.modified_at ? `<button onclick="openRestoreModal('${b.database}')" class="text-[11px] text-brand-terracotta hover:underline mt-0.5">Restore…</button>` : ''}
    </div>
  </div>`;
}

async function loadBackups() {
  const el = document.getElementById('backups-body');
  if (!el) return;
  el.innerHTML = `<div class="text-xs text-brand-muted">Loading…</div>`;
  try {
    const r = await fetch('/api/backups/status');
    if (r.status === 403) { el.innerHTML = `<div class="text-xs text-brand-muted">Needs sql access to view.</div>`; return; }
    const d = await r.json();
    const dev = d.backups.filter(b => b.tier === 'dev');
    const staging = d.backups.filter(b => b.tier === 'staging');
    el.innerHTML = `
      <div class="mb-1"><span class="text-[10px] font-bold uppercase tracking-wider ${TIER_BADGE.dev} px-1.5 py-0.5 rounded-full">${TIER_LABEL.dev}</span></div>
      ${dev.map(backupRow).join('')}
      <div class="mb-1 mt-3"><span class="text-[10px] font-bold uppercase tracking-wider ${TIER_BADGE.staging} px-1.5 py-0.5 rounded-full">${TIER_LABEL.staging}</span></div>
      ${staging.map(backupRow).join('')}`;
  } catch (e) {
    el.innerHTML = `<div class="text-xs text-brand-muted">Could not load: ${String(e)}</div>`;
  }
}

// --- Restore modal: pick a backup -> preview per-table row-count diff ->
// type the db name to confirm -> final danger confirm -> restore. Local
// backups only (see routers/backups.py's own note on why off-host copies
// are never restorable through this UI at all).
let _restoreState = null;

function closeRestoreModal() {
  document.getElementById('restore-modal-root').innerHTML = '';
  _restoreState = null;
}

async function openRestoreModal(database) {
  _restoreState = { database, file: null };
  const root = document.getElementById('restore-modal-root');
  root.innerHTML = `<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4" onclick="if(event.target===this) closeRestoreModal()">
    <div class="w-full max-w-lg bg-brand-panel border border-brand-border rounded-2xl p-6 shadow-2xl">
      <h3 class="text-sm font-semibold mb-1">Restore ${database}</h3>
      <p class="text-xs text-brand-muted mb-4">Local backups only. This overwrites the live database — nothing runs until you confirm at the end.</p>
      <div id="restore-body"><div class="text-xs text-brand-muted">Loading available backups…</div></div>
      <div class="flex justify-end gap-2.5 mt-5">
        <button onclick="closeRestoreModal()" class="px-4 py-2 rounded-lg text-xs font-semibold text-brand-muted hover:text-brand-ink hover:bg-brand-panel2 transition-all">Cancel</button>
      </div>
    </div>
  </div>`;

  try {
    const r = await fetch(`/api/backups/list?database=${encodeURIComponent(database)}`);
    const d = await r.json();
    const body = document.getElementById('restore-body');
    if (!d.files || !d.files.length) {
      body.innerHTML = `<div class="text-xs text-brand-muted">No local backups found for ${database}.</div>`;
      return;
    }
    body.innerHTML = `
      <label class="block text-xs font-medium text-brand-muted mb-1.5">Backup to restore</label>
      <select id="restore-file-select" class="w-full px-3 py-2 rounded-lg bg-brand-navy2 border border-brand-border text-sm outline-none focus:border-brand-gold transition-all mb-4">
        ${d.files.map((f, i) => `<option value="${f.file}">${new Date(f.modified_at).toLocaleString()} · ${fmtBytes(f.size_bytes)}${i === 0 ? ' (latest)' : ''}</option>`).join('')}
      </select>
      <button id="restore-preview-btn" class="px-3.5 py-2 rounded-lg bg-brand-panel2 border border-brand-border text-xs font-medium transition-all hover:border-brand-gold">Preview changes</button>
      <div id="restore-preview-body" class="mt-4"></div>`;
    document.getElementById('restore-preview-btn').onclick = () => previewRestore(database, document.getElementById('restore-file-select').value);
  } catch (e) {
    document.getElementById('restore-body').innerHTML = `<div class="text-xs text-brand-terracotta">Could not load backups: ${String(e)}</div>`;
  }
}

async function previewRestore(database, file) {
  _restoreState = { database, file };
  const el = document.getElementById('restore-preview-body');
  el.innerHTML = `<div class="text-xs text-brand-muted">Comparing against live data…</div>`;
  try {
    const r = await fetch(`/api/backups/preview?database=${encodeURIComponent(database)}&file=${encodeURIComponent(file)}`);
    const d = await r.json();
    if (!r.ok) { el.innerHTML = `<div class="text-xs text-brand-terracotta">${d.detail || 'Preview failed'}</div>`; return; }
    if (!d.live_db_reachable) {
      el.innerHTML = `<div class="text-xs text-brand-terracotta mb-3">Could not read the live database to compare — proceed with extra caution.</div>`;
    }
    const rows = d.tables.map(t => {
      const changed = t.current_rows !== t.backup_rows;
      return `<div class="flex items-center justify-between text-xs py-1 ${changed ? 'text-brand-gold' : 'text-brand-muted'}">
        <span class="font-mono">${t.table}</span>
        <span>${t.current_rows ?? '?'} rows → ${t.backup_rows} rows</span>
      </div>`;
    }).join('');
    el.innerHTML = `
      <div class="text-[10px] font-bold uppercase tracking-wider text-brand-muted mb-2">What will change (current → after restore)</div>
      <div class="max-h-56 overflow-y-auto border border-brand-border rounded-lg p-2 mb-4">${rows || '<div class=\"text-xs text-brand-muted\">No tables found in backup.</div>'}</div>
      <button id="restore-confirm-btn" class="px-3.5 py-2 rounded-lg bg-brand-terracotta text-white text-xs font-semibold transition-all hover:brightness-110">Continue to restore</button>`;
    document.getElementById('restore-confirm-btn').onclick = () => confirmRestore(database, file);
  } catch (e) {
    el.innerHTML = `<div class="text-xs text-brand-terracotta">Preview failed: ${String(e)}</div>`;
  }
}

async function confirmRestore(database, file) {
  const typed = await dialogPrompt(`Type "${database}" to confirm — this permanently overwrites the live database with this backup.`, '');
  if (typed !== database) {
    if (typed !== null) await dialogAlert('Name did not match — restore cancelled.');
    return;
  }
  if (!(await dialogConfirm(`Final confirmation: restore ${database} from this backup now? This cannot be undone.`, { confirmText: 'Restore', danger: true }))) return;

  closeRestoreModal();
  try {
    const r = await fetch('/api/backups/restore', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ database, file, confirm_name: database }),
    });
    const d = await r.json();
    if (r.ok && d.ok) {
      await dialogAlert(`${database} restored successfully.`);
    } else {
      await dialogAlert(`Restore failed:\n${d.output || d.detail || 'unknown error'}`);
    }
  } catch (e) {
    await dialogAlert(`Restore failed: ${String(e)}`);
  }
  await loadBackups();
}

async function runBackupNow(btn) {
  if (!(await dialogConfirm('Back up all 4 databases now?', { confirmText: 'Back up' }))) return;
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Backing up… (can take a minute)';
  try {
    const r = await fetch('/api/backups/run', { method: 'POST' });
    const d = await r.json();
    if (!r.ok || !d.ok) await dialogAlert('Backup failed:\n' + (d.output || d.detail || 'unknown error'));
  } catch (e) {
    await dialogAlert(String(e));
  }
  btn.disabled = false;
  btn.textContent = original;
  await loadBackups();
}

async function loadStats(first) {
  const [contRes, statsRes] = await Promise.all([fetch('/api/system/containers'), fetch('/api/system/stats')]);
  const content = document.getElementById('content');
  if (contRes.status === 403 || statsRes.status === 403) {
    content.innerHTML = `<div class="max-w-md mx-auto mt-16 text-center animate-fade-in-up">
      <div class="text-sm text-brand-muted">Your role (${me.role}) can't view system status — needs docker access.</div>
    </div>`;
    return;
  }
  const containers = (await contRes.json()).containers || [];
  const stats = await statsRes.json();
  const statsByName = {};
  (stats.container_stats || []).forEach(s => { statsByName[s.Name] = s; });

  const up = containers.filter(c => (c.State || '').toLowerCase() === 'running').length;
  const diskMatch = (stats.disk || '').match(/(\d+)%/);
  const diskPct = diskMatch ? parseInt(diskMatch[1]) : 0;
  const load = (stats.loadavg || '').split(' ').slice(0, 3);

  const topByCpu = Object.values(statsByName)
    .sort((a, b) => parsePercent(b.CPUPerc) - parsePercent(a.CPUPerc))
    .slice(0, 8);

  const TIER_ORDER = { infra: 0, dev: 1, staging: 2, sandbox: 3, other: 4 };
  const sortedContainers = [...containers].sort((a, b) => {
    const ta = TIER_ORDER[(a.Meta || {}).tier] ?? 9, tb = TIER_ORDER[(b.Meta || {}).tier] ?? 9;
    return ta - tb || (a.Names || '').localeCompare(b.Names || '');
  });
  const rows = sortedContainers.map((c, i) => {
    const s = statsByName[c.Names] || {};
    const running = (c.State || '').toLowerCase() === 'running';
    const meta = c.Meta || { label: c.Names, tier: 'other', description: '' };
    return `<tr class="border-b border-brand-border/60 hover:bg-brand-panel/60 transition-colors animate-fade-in" style="animation-delay:${Math.min(i*15,300)}ms">
      <td class="py-2.5 px-4">
        <div class="flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full ${running ? 'bg-emerald-400 animate-pulse-dot' : 'bg-brand-terracotta'} shrink-0"></span>
          <div class="min-w-0">
            <div class="text-sm font-medium">${meta.label}${meta.tier !== 'other' ? ` <span class="text-[9px] font-bold uppercase tracking-wider ${TIER_BADGE[meta.tier]} px-1.5 py-0.5 rounded-full ml-1">${TIER_LABEL[meta.tier]}</span>` : ''}</div>
            <div class="text-[11px] text-brand-muted font-mono truncate">${c.Names}</div>
            ${meta.description ? `<div class="text-[11px] text-brand-muted truncate max-w-[280px]" title="${meta.description.replace(/"/g, '&quot;')}">${meta.description}</div>` : ''}
          </div>
        </div>
      </td>
      <td class="py-2.5 px-4 text-xs text-brand-muted font-mono truncate max-w-[160px]">${(c.Image || '').slice(0, 30)}</td>
      <td class="py-2.5 px-4 text-xs text-brand-muted">${c.Status || ''}</td>
      <td class="py-2.5 px-4 text-xs font-mono">${s.CPUPerc || '—'}</td>
      <td class="py-2.5 px-4 text-xs font-mono">${s.MemUsage || '—'}</td>
    </tr>`;
  }).join('');

  if (first) {
    content.innerHTML = `
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <div class="bg-brand-panel border border-brand-border rounded-xl p-5 shadow-panel animate-fade-in-up">
          <div class="text-xs text-brand-muted mb-1">Containers running</div>
          <div class="text-2xl font-bold"><span id="stat-up">${up}</span> <span class="text-brand-muted text-base font-normal">/ ${containers.length}</span></div>
        </div>
        <div class="bg-brand-panel border border-brand-border rounded-xl p-5 shadow-panel animate-fade-in-up" style="animation-delay:40ms">
          <div class="text-xs text-brand-muted mb-1">Load average (1m / 5m / 15m)</div>
          <div id="stat-load" class="text-2xl font-bold font-mono">${load.join(' / ')}</div>
        </div>
        <div class="bg-brand-panel border border-brand-border rounded-xl p-5 shadow-panel animate-fade-in-up" style="animation-delay:80ms">
          <div class="text-xs text-brand-muted mb-1">Disk usage (repo mount)</div>
          <div id="stat-disk" class="text-2xl font-bold">${diskPct}%</div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
        <div class="lg:col-span-2 bg-brand-panel border border-brand-border rounded-xl p-5 shadow-panel animate-fade-in-up" style="animation-delay:120ms">
          <h2 class="text-sm font-semibold mb-3">Top containers by CPU</h2>
          <canvas id="cpu-chart" height="140"></canvas>
        </div>
        <div class="bg-brand-panel border border-brand-border rounded-xl p-5 shadow-panel animate-fade-in-up" style="animation-delay:160ms">
          <h2 class="text-sm font-semibold mb-3">Disk usage</h2>
          <canvas id="disk-chart" height="140"></canvas>
        </div>
      </div>

      <div class="bg-brand-panel border border-brand-border rounded-xl overflow-hidden shadow-panel animate-fade-in-up mb-6" style="animation-delay:200ms">
        <div class="px-4 py-3 border-b border-brand-border text-sm font-semibold">Containers (this host, all projects)</div>
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead><tr class="border-b border-brand-border text-[11px] uppercase tracking-wider text-brand-muted">
              <th class="py-2.5 px-4 font-semibold">Name</th><th class="py-2.5 px-4 font-semibold">Image</th><th class="py-2.5 px-4 font-semibold">Status</th><th class="py-2.5 px-4 font-semibold">CPU</th><th class="py-2.5 px-4 font-semibold">Memory</th>
            </tr></thead>
            <tbody id="containers-tbody">${rows}</tbody>
          </table>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        <div class="bg-brand-panel border border-brand-border rounded-xl p-5 shadow-panel animate-fade-in-up" style="animation-delay:240ms">
          <h2 class="text-sm font-semibold mb-3">Doctor — health checks</h2>
          <div id="doctor-body"><div class="text-xs text-brand-muted">Loading…</div></div>
        </div>
        <div class="bg-brand-panel border border-brand-border rounded-xl p-5 shadow-panel animate-fade-in-up" style="animation-delay:260ms">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-semibold">Database backups</h2>
            <button id="backup-now-btn" class="px-2.5 py-1 rounded-lg bg-brand-panel2 border border-brand-border text-xs font-medium transition-all hover:border-brand-gold">Back up now</button>
          </div>
          <div id="backups-body"><div class="text-xs text-brand-muted">Loading…</div></div>
          <div class="text-[10px] text-brand-muted mt-2">Also runs automatically every night.</div>
        </div>
      </div>

      <div class="bg-brand-panel border border-brand-border rounded-xl overflow-hidden shadow-panel animate-fade-in-up" style="animation-delay:280ms">
        <div class="px-4 py-3 border-b border-brand-border text-sm font-semibold">Audit log — every proposed and executed action, every user</div>
        <div id="activity-list" class="divide-y divide-brand-border/60"><div class="text-xs text-brand-muted px-4 py-3">Loading…</div></div>
      </div>`;
      loadActivity();
      loadDoctor();
      loadBackups();
      loadDiffBadge();
      document.getElementById('backup-now-btn').onclick = (e) => runBackupNow(e.target);

    cpuChart = new Chart(document.getElementById('cpu-chart'), {
      type: 'bar',
      data: {
        labels: topByCpu.map(s => s.Name),
        datasets: [{ data: topByCpu.map(s => parsePercent(s.CPUPerc)), backgroundColor: '#f5b93f', borderRadius: 4, maxBarThickness: 22 }],
      },
      options: {
        indexAxis: 'y',
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#8ba3b6', font: { size: 10 } }, grid: { color: '#20415e' } },
          y: { ticks: { color: '#8ba3b6', font: { size: 10 } }, grid: { display: false } },
        },
      },
    });

    diskChart = new Chart(document.getElementById('disk-chart'), {
      type: 'doughnut',
      data: { labels: ['Used', 'Free'], datasets: [{ data: [diskPct, 100 - diskPct], backgroundColor: [diskPct > 85 ? '#c9835a' : '#3fa39a', '#20415e'], borderColor: '#122f4a', borderWidth: 3 }] },
      options: { plugins: { legend: { display: false } }, cutout: '72%' },
    });
  } else {
    document.getElementById('stat-up').textContent = up;
    document.getElementById('stat-load').textContent = load.join(' / ');
    document.getElementById('stat-disk').textContent = diskPct + '%';
    document.getElementById('containers-tbody').innerHTML = rows;
    cpuChart.data.labels = topByCpu.map(s => s.Name);
    cpuChart.data.datasets[0].data = topByCpu.map(s => parsePercent(s.CPUPerc));
    cpuChart.update();
    diskChart.data.datasets[0].data = [diskPct, 100 - diskPct];
    diskChart.update();
  }
}

function activityTimeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (isNaN(s)) return '';
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

async function loadActivity() {
  const el = document.getElementById('activity-list');
  if (!el) return;
  try {
    const res = await fetch('/api/deploy/activity?limit=40');
    if (!res.ok) { el.innerHTML = `<div class="text-xs text-brand-muted px-4 py-3">Could not load activity (${res.status}).</div>`; return; }
    const { activity } = await res.json();
    if (!activity.length) { el.innerHTML = `<div class="text-xs text-brand-muted px-4 py-3">No activity recorded yet.</div>`; return; }
    el.innerHTML = activity.map((a, i) => {
      const executed = a.event === 'executed';
      const dot = !executed ? 'bg-brand-gold' : (a.ok ? 'bg-emerald-400' : 'bg-brand-terracotta');
      const label = !executed ? 'proposed' : (a.ok ? 'ran ok' : 'failed');
      return `<div class="flex items-center gap-3 px-4 py-2.5 text-xs animate-fade-in" style="animation-delay:${Math.min(i * 15, 300)}ms">
        <span class="w-1.5 h-1.5 rounded-full ${dot} shrink-0"></span>
        <span class="font-mono text-brand-ink shrink-0">${a.action_type}</span>
        <span class="text-brand-muted shrink-0">${label}</span>
        <span class="text-brand-muted truncate flex-1">${(a.actor || 'unknown').replace(/</g, '&lt;')}</span>
        <span class="text-brand-muted shrink-0">${activityTimeAgo(a.created_at)}</span>
      </div>`;
    }).join('');
  } catch (e) {
    el.innerHTML = `<div class="text-xs text-brand-muted px-4 py-3">Could not load activity: ${String(e)}</div>`;
  }
}

async function init() {
  me = await mountShell('/system');
  if (!me) return;
  document.getElementById('content').innerHTML = skeleton();
  document.getElementById('refresh-note').innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse-dot"></span>Auto-refreshes every 10s`;
  await loadStats(true);
  setInterval(() => loadStats(false), 10000);
}
init();
</script>
</body>
</html>
